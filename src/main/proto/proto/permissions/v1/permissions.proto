            pattern: "^[a-z0-9-]+$"
        }
    ];
    // name is the group's slug.
    string name = 2 [
        (validate.rules).string = {
            min_len: 1,
            max_len: 64,
            pattern: "^[a-z0-9-]+$"
        }
    ];
    // principal_ids are the principals to remove.
    repeated string principal_ids = 3 [(validate.rules).repeated = {
        unique: true
        min_items: 1
        max_items: 100
        items: {
            string: {
                min_len: 1
            }
        }
    }];
}

// RemoveGroupMembersResponse is the result of RemoveGroupMembers.
message RemoveGroupMembersResponse {
    // removed_principal_ids are the principals that were removed, in request order.
    repeated string removed_principal_ids = 1;
    // not_member_principal_ids are the principals that were not members, in request order.
    repeated string not_member_principal_ids = 2;
}

// ListGroupMembersRequest is the request of ListGroupMembers.
message ListGroupMembersRequest {
    // project_name is the name of the project that the group belongs to.
    string project_name = 1 [
        (validate.rules).string = {
            min_len: 1,
            max_len: 32,
            pattern: "^[a-z0-9-]+$"
        }
    ];
    // name is the group's slug.
    string name = 2 [
        (validate.rules).string = {
            min_len: 1,
            max_len: 64,
            pattern: "^[a-z0-9-]+$"
        }
    ];
    optional pagination.PaginationRequest pagination = 3;
}

// GroupMember is one member of a group.
message GroupMember {
    string principal_id = 1;
    // created_at is when the principal was added to the group.
    google.protobuf.Timestamp created_at = 2;
}

// ListGroupMembersResponse is a page of group members.
message ListGroupMembersResponse {
    repeated GroupMember members = 1;
    pagination.PaginationResponse pagination = 2;
}

// ListGroupsForPrincipalRequest is the request of ListGroupsForPrincipal.
message ListGroupsForPrincipalRequest {
    // project_name is the name of the project to look in.
    string project_name = 1 [
        (validate.rules).string = {
            min_len: 1,
            max_len: 32,
            pattern: "^[a-z0-9-]+$"
        }
    ];
    // principal_id is the unique identifier of the principal.
    string principal_id = 2 [(validate.rules).string = {min_len: 1}];
    optional pagination.PaginationRequest pagination = 3;
}

// ListGroupsForPrincipalResponse is a page of the groups a principal is a member of.
message ListGroupsForPrincipalResponse {
    repeated Group groups = 1;
    pagination.PaginationResponse pagination = 2;
}

// WhoAmIRequest is the request of WhoAmI. It has no fields: WhoAmI describes the caller's own credential.
message WhoAmIRequest {}

// WhoAmIResponse describes the caller.
message WhoAmIResponse {
    // principal_id is the caller's principal ID: the user's ID, the API key's ID, or the service account's ID.
    string principal_id = 1;
    // organisation_id is the caller's organisation. It is empty for a user who has not joined an organisation yet.
    string organisation_id = 2;
    // principal_type says what kind of credential the caller used.
    PrincipalType principal_type = 3;
    // project_name is the project an API key belongs to; an API key can only be used in this project. It is empty for
    // users, who can use every project of their organisation.
    string project_name = 4;
    // api_key_access is an API key's access level on its project. It is unspecified for users and service accounts.
    APIKeyAccess api_key_access = 5;
    // email is the user's email address (users only; may be empty).
    string email = 6;
}

// PrincipalType is the kind of credential a caller authenticated with.
enum PrincipalType {
    PRINCIPAL_TYPE_UNSPECIFIED = 0;
    // A dashboard user, signed in with Firebase.
    PRINCIPAL_TYPE_USER = 1;
    // A perms.io API key.
    PRINCIPAL_TYPE_API_KEY = 2;
    // A Google service account (internal callers).
    PRINCIPAL_TYPE_SERVICE_ACCOUNT = 3;
}

// APIKeyAccess is the level of access an API key has on its project, as reported by WhoAmI. It is derived from what
// the key is actually allowed to do, so a key whose access has been changed by hand may report UNSPECIFIED.
enum APIKeyAccess {
    // Not an API key, or a key whose permissions match neither level.
    API_KEY_ACCESS_UNSPECIFIED = 0;
    // The key can run checks and read the project's permissions, roles, grants and groups.
    API_KEY_ACCESS_CHECK = 1;
    // The key can also create, update and delete permissions, roles and groups, and grant and revoke.
    API_KEY_ACCESS_FULL = 2;
}
